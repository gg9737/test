<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Реклама</title>
  <link href="style.css" rel="stylesheet" />
</head>
<body>
  <div class="container">
    <h1>Создай рекламное изображение</h1>
    <form id="adForm">
      <input type="text" placeholder="Название продукта" name="product" required />
      <textarea placeholder="Описание" name="description" required></textarea>
      <input type="text" placeholder="Целевая аудитория" name="audience" required />
      <input type="text" placeholder="Оффер (например, -20%)" name="offer" required />
      <div class="file-wrapper">
        <label for="fileInput">Выбрать изображение</label>
        <input type="file" id="fileInput" name="file" accept="image/*" required />
      </div>
      <button type="submit">Сгенерировать</button>
    </form>
  </div>
</body>
</html>
