
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Создай рекламное изображение</title>
  <link href="style.css" rel="stylesheet" />
</head>
<body>
  <div class="container">
    <h1>Создай рекламное изображение</h1>
    <form id="adForm">
      <input type="text" placeholder="Название продукта" name="product" required />
      <textarea placeholder="Описание" name="description" required></textarea>
      <input type="text" placeholder="Целевая аудитория" name="audience" required />
      <input type="text" placeholder="Оффер (например, -20%)" name="offer" required />

      <label class="custom-file-upload">
        <input type="file" name="image" id="imageInput" required />
        <span id="fileLabel">Выбрать изображение</span>
      </label>
      <div id="fileNamePreview"></div>

      <button type="submit">Сгенерировать</button>
    </form>

    <div id="thankYou" class="hidden">
      <h2>✅ Запрос отправлен!</h2>
      <p>Ожидайте изображение в Telegram или проверьте бот.</p>
    </div>
  </div>

  <script>
    const form = document.getElementById('adForm');
    const thankYou = document.getElementById('thankYou');
    const fileInput = document.getElementById('imageInput');
    const fileNamePreview = document.getElementById('fileNamePreview');
    const fileLabel = document.getElementById('fileLabel');

    fileInput.addEventListener('change', () => {
      const fileName = fileInput.files[0]?.name || '';
      fileNamePreview.textContent = fileName ? `📎 Прикреплено: ${fileName}` : '';
    });

    form.addEventListener('submit', (e) => {
      e.preventDefault();

      // Здесь ты можешь отправить форму в n8n через fetch()
      form.classList.add('hidden');
      thankYou.classList.remove('hidden');
    });
  </script>
</body>
</html>
