
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Генерация креативов</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container" id="formContainer">
    <h1 class="title">Создай рекламное<br>изображение</h1>
    <form id="adForm" autocomplete="off">
      <input type="text" name="title" placeholder="Название продукта" required />
      <textarea name="description" placeholder="Описание" required></textarea>
      <input type="text" name="audience" placeholder="Целевая аудитория" required />
      <input type="text" name="offer" placeholder="Оффер (например, -20%)" required />

      <label class="custom-file-upload">
        <input type="file" name="image" id="imageInput" />
        Выбрать изображение
      </label>
      <p id="fileName" class="filename"></p>

      <button type="submit" id="submitBtn">Сгенерировать</button>
    </form>
  </div>

  <div class="container hidden" id="thankYouContainer">
    <h1 class="title">Генерация началась!</h1>
    <h2 class="success">✅ Запрос отправлен!</h2>
    <p>Ожидайте изображение в Telegram через 2–3 минуты или проверьте бота.</p>
    <div class="buttons">
      <button onclick="reloadPage()">🌀 Заказать еще один креатив</button>
      <a href="https://t.me/cocktest88bot" target="_blank">📦 Перейти в бота</a>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
