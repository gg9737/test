
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Создание креатива</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="container" id="form-container">
    <h1>Создай рекламное изображение</h1>
    <form id="adForm">
      <input type="text" id="product" name="product" placeholder="Название продукта" autocomplete="off" required />
      <textarea id="description" name="description" placeholder="Описание" autocomplete="off" required></textarea>
      <input type="text" id="audience" name="audience" placeholder="Целевая аудитория" autocomplete="off" required />
      <input type="text" id="offer" name="offer" placeholder="Оффер (например, -20%)" autocomplete="off" required />
      <label for="file-upload" class="custom-file-upload">Выбрать изображение</label>
      <input id="file-upload" type="file" name="image" accept="image/*"/>
      <div id="file-name-display"></div>
      <button type="submit" id="generate-btn">Сгенерировать</button>
    </form>
  </div>

  <div class="container hidden" id="thank-you-container">
    <h1>Генерация началась!</h1>
    <p class="success"><span>✅</span> Запрос отправлен!</p>
    <p>Ожидайте 2–3 минуты. Изображение поступит в Telegram или проверьте бота.</p>
    <div class="button-group">
      <button onclick="location.reload()">Заказать еще один креатив</button>
      <a href="https://t.me/cocktest88bot" target="_blank">
        <button>Перейти в бота</button>
      </a>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
