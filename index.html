
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Генератор креативов</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <div id="formContainer">
      <h1>Создай рекламное изображение</h1>
      <form id="adForm">
        <input type="text" name="title" placeholder="Название продукта" required />
        <textarea name="description" placeholder="Описание продукта" required></textarea>
        <input type="text" name="audience" placeholder="Целевая аудитория" required />
        <input type="text" name="offer" placeholder="Оффер / Акция" required />
        <label for="imageInput" class="custom-file-upload">Выбрать изображение</label>
        <input type="file" id="imageInput" name="image" accept="image/*" required hidden />
        <span id="fileName"></span>
        <button type="submit">Сгенерировать</button>
      </form>
    </div>

    <div id="thankYouContainer" class="hidden">
      <h1>Генерация началась!</h1>
      <p>⏳ Пожалуйста, подождите 2–3 минуты. Ваш креатив скоро будет готов.</p>
      <img id="resultImage" src="" alt="Generated Ad" style="max-width: 100%; border-radius: 12px; margin-top: 20px; display: none;" />
      <div class="button-group">
        <button onclick="reloadPage()">🔁 Заказать ещё один креатив</button>
        <a href="https://t.me/your_bot_username" target="_blank">
          <button>📥 Перейти в бота</button>
        </a>
      </div>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
